<script>
  // Paste your Apps Script Web App URL here if hosted on GitHub Pages:
  var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxphWRscuXonv9zMQKccCguQ-U5EFEVMa67I_OqPdJa84DkizoeQWjnJLySosuNCgTDsg/exec"; 
  var DATA = null;

  function value(id) {
    return document.getElementById(id).value.trim();
  }

  function numOptions(select) {
    select.innerHTML = '';
    for (var i = 0; i <= 50; i++) {
      var option = document.createElement('option');
      option.value = i;
      option.textContent = i;
      select.appendChild(option);
    }
    select.value = '0';
  }

  function setContactLocked(locked) {
    ['contact', 'contactEmail', 'contactPhone'].forEach(function (id) {
      var field = document.getElementById(id);
      field.readOnly = locked;
      field.classList.toggle('locked', locked);
    });
    document.getElementById('contactHint').textContent = locked
      ? 'This designated contact comes from Clinic Master and cannot be edited.'
      : 'Enter the contact for this order. This unlisted clinic will not be added to Clinic Master.';
  }

  function loadForm() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(renderForm)
        .withFailureHandler(handleError)
        .getFormData();
    } else {
      fetch(WEB_APP_URL + '?action=getFormData')
        .then(function(res) { return res.json(); })
        .then(function(res) {
          if (res.status === 'success') renderForm(res.data);
          else handleError(new Error(res.message));
        })
        .catch(handleError);
    }
  }

  function renderForm(data) {
    DATA = data;
    populateClinicOptions();

    document.querySelectorAll('.numsel').forEach(numOptions);
    var bandGrid = document.getElementById('bandGrid');
    data.bands.forEach(function (bandName) {
      var wrapper = document.createElement('div');
      wrapper.className = 'band';
      var label = document.createElement('span');
      label.textContent = bandName.replace('-', ' ');
      var select = document.createElement('select');
      select.id = 'band_' + bandName;
      numOptions(select);
      wrapper.appendChild(label);
      wrapper.appendChild(select);
      bandGrid.appendChild(wrapper);
    });

    var clinicSelect = document.getElementById('clinic');
    clinicSelect.addEventListener('change', onClinicChange);
    clinicSelect.addEventListener('input', function () {
      var typedValue = this.value;
      var isValidChoice = typedValue === 'My clinic is not listed' ||
        DATA.clinics.some(function (clinic) { return clinic.key === typedValue; });
      if (isValidChoice) onClinicChange();
    });

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('form').classList.remove('hidden');
  }

  function handleError(error) {
    document.getElementById('loading').classList.add('hidden');
    var box = document.getElementById('loadError');
    box.textContent = 'Could not load Clinic Master: ' + error.message;
    box.classList.remove('hidden');
  }

  function populateClinicOptions() {
    var optionList = document.getElementById('clinicOptions');
    optionList.innerHTML = '';
    DATA.clinics.forEach(function (clinic) {
      var option = document.createElement('option');
      option.value = clinic.key;
      optionList.appendChild(option);
    });

    var newOption = document.createElement('option');
    newOption.value = 'My clinic is not listed';
    optionList.appendChild(newOption);
  }

  function onClinicChange() {
    var key = document.getElementById('clinic').value;
    var isNew = key === 'My clinic is not listed';
    var source = document.getElementById('clinicSource');
    document.getElementById('newClinicBox').classList.toggle('hidden', !isNew);

    document.getElementById('contact').value = '';
    document.getElementById('contactEmail').value = '';
    document.getElementById('contactPhone').value = '';

    if (isNew) {
      source.textContent = 'Manually entered — not saved to Clinic Master';
      source.className = 'source manual';
      setContactLocked(false);
      return;
    }

    setContactLocked(true);
    if (!key) {
      source.classList.add('hidden');
      return;
    }

    source.textContent = 'Approved Clinic Master record';
    source.className = 'source';

    var clinic = DATA.clinics.find(function (item) { return item.key === key; });
    if (!clinic) return;

    document.getElementById('contact').value = clinic.contactName || '';
    document.getElementById('contactEmail').value = clinic.contactEmail || '';
    document.getElementById('contactPhone').value = clinic.contactPhone || '';
  }

  function validateForm(isNew) {
    var selectedClinic = document.getElementById('clinic').value;
    if (!selectedClinic) return 'Please select a clinic.';
    if (!isNew && !DATA.clinics.some(function (clinic) { return clinic.key === selectedClinic; })) {
      return 'Select a clinic from the list, or choose “My clinic is not listed”.';
    }

    if (isNew) {
      var required = [
        ['newOrganization', 'Organization name'],
        ['newLocation', 'Clinic location'],
        ['newStreet1', 'Street address'],
        ['newCity', 'City'],
        ['newState', 'State/Province'],
        ['newCountry', 'Country'],
        ['newPostalCode', 'Postal code']
      ];
      for (var i = 0; i < required.length; i++) {
        if (!value(required[i][0])) return required[i][1] + ' is required.';
      }
    }

    if (!value('contact') || !value('contactEmail') || !value('contactPhone')) {
      return isNew
        ? 'Contact name, email, and phone are required.'
        : 'This clinic has incomplete designated-contact details in Clinic Master.';
    }
    if (!value('requestor')) return 'Your name is required.';
    if (!value('requestorEmail')) return 'Your email is required.';
    if (!document.getElementById('requestorEmail').checkValidity()) return 'Enter a valid requestor email.';
    if (!document.getElementById('contactEmail').checkValidity()) return 'Enter a valid contact email.';
    if (!document.getElementById('kitType').value) return 'Select a request type.';

    var total = Number(document.getElementById('kits').value);
    DATA.bands.forEach(function (bandName) {
      total += Number(document.getElementById('band_' + bandName).value);
    });
    if (total === 0) return 'Enter at least one requested item.';
    return '';
  }

  function submitOrder() {
    var selectedClinic = document.getElementById('clinic').value;
    var isNew = selectedClinic === 'My clinic is not listed';
    var error = validateForm(isNew);
    if (error) { alert(error); return; }

    var bands = {};
    DATA.bands.forEach(function (bandName) {
      bands[bandName] = document.getElementById('band_' + bandName).value;
    });

    var payload = {
      action: 'submitOrder',
      isNewClinic: isNew,
      clinicKey: isNew ? '' : selectedClinic,
      newClinic: isNew ? {
        organization: value('newOrganization'),
        location: value('newLocation'),
        street1: value('newStreet1'),
        street2: value('newStreet2'),
        city: value('newCity'),
        state: value('newState'),
        country: value('newCountry'),
        postalCode: value('newPostalCode')
      } : null,
      contact: value('contact'),
      contactEmail: value('contactEmail'),
      contactPhone: value('contactPhone'),
      requestor: value('requestor'),
      requestorEmail: value('requestorEmail'),
      kitType: document.getElementById('kitType').value,
      kits: document.getElementById('kits').value,
      bands: bands,
      notes: value('notes')
    };

    var button = document.getElementById('submitBtn');
    button.disabled = true;
    button.textContent = 'Submitting…';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(showDone)
        .withFailureHandler(function (err) {
          button.disabled = false;
          button.textContent = 'Submit request';
          alert('Something went wrong: ' + err.message);
        })
        .submitOrder(payload);
    } else {
      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(function(res) { return res.json(); })
      .then(function(res) {
        if (res.status === 'success') showDone(res);
        else throw new Error(res.message);
      })
      .catch(function(err) {
        button.disabled = false;
        button.textContent = 'Submit request';
        alert('Something went wrong: ' + err.message);
      });
    }
  }

  function showDone(result) {
    document.getElementById('form').classList.add('hidden');
    var done = document.getElementById('done');
    done.innerHTML = '<b>Request received</b><br><br>Your order reference is<br><b>' +
      result.orderId + '</b><br><br>Band Connect will confirm before shipping.';
    done.classList.remove('hidden');
  }

  loadForm();
</script>
